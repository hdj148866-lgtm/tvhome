
name: Build tvhome APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'tvhome-main.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q tvhome-main.zip
          chmod +x tvhome-main/gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > tvhome-main/local.properties

      - name: Build release APK
        run: |
          cd tvhome-main
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-release-apk
          path: tvhome-main/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
